[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-optimizer"
version = "0.1.0"
description = "Agent for Google Ads campaign setup audit and optimization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "google-ads>=31.3.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "rich>=13.0.0",
  "typer>=0.12.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "google-analytics-data>=0.18.0",
  "google-analytics-admin>=0.23.0",
  "google-auth-oauthlib>=1.2.0",
]

[project.optional-dependencies]
mcp = [
  "google-ads-mcp>=0.0.1",
  "mcp>=1.9",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
gads-agent = "ads_optimizer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ads_optimizer = ["knowledge/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"